n></div><button id="pullBtn" class="btn summon-btn" onclick="pull()">🎴 OPEN PACK — 300</button><div class="reveal-title" id="revealTitle"></div></div><div class="result" id="result"></div></section></main><footer>CARDVERSE V29</footer><script src="app.js"></script><script>let busy=false;function updatePity(){document.getElementById('pityText').textContent=`Pity: ${state().pity} / 10`}function pull(){if(busy)return;const ids=openPack(300);if(!ids.length)return;busy=true;const scene=document.getElementById('packScene'),btn=document.getElementById('pullBtn'),res=document.getElementById('result'),title=document.getElementById('revealTitle');btn.disabled=true;res.innerHTML='';title.textContent=t('summon');scene.classList.remove('opening','burst');void scene.offsetWidth;scene.classList.add('opening');setTimeout(()=>scene.classList.add('burst'),950);setTimeout(()=>{title.textContent=t('reveal');res.innerHTML=ids.map((id,i)=>{const c=CARDS.find(x=>x.id===id);return `<div class="reveal-wrap rarity-${c.rarity.toLowerCase()}" style="--delay:${i*220}ms"><div class="flip-card"><div class="flip-inner"><div class="flip-front"><div class="mystery">?</div></div><div class="flip-back">${cardHTML(c)}</div></div></div></div>`}).join('')},1300);setTimeout(()=>{document.querySelectorAll('.flip-card').forEach(x=>x.classList.add('flipped'));const got=ids.map(id=>CARDS.find(x=>x.id===id));const best=got.sort((a,b)=>b.stars-a.stars)[0];title.textContent=best.rarity==='LEGENDARY'?'🔥 LEGENDARY DROP!':best.rarity==='EPIC'?'✨ EPIC DROP!':'CARD REVEAL';updatePity();busy=false;btn.disabled=false},1500+ids.length*240)}updatePity();</script></body></html>
